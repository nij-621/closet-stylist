<script>
// 테마: 그리기 전에 붙여 깜빡임을 막고, 아이폰 "홈 화면에 추가"가 읽는 아이콘·매니페스트도 테마 것으로 바꿈.
// 사파리와 홈 화면 앱은 저장 공간이 따로라서 ?skin=pc|plaid|base 로 테마를 넘김 — 사파리에선 항상 따르고,
// 홈 화면 앱(매니페스트 start_url)에선 아직 고른 테마가 없을 때만(첫 실행) 따름.
try {
  var q = new URLSearchParams(location.search).get("skin"), k = localStorage.getItem("stylist.skin");
  var app = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  if (/^(base|plaid|pc)$/.test(q || "") && (!app || !k)) { k = q; localStorage.setItem("stylist.skin", k); }
  if (k === "plaid" || k === "pc") {
    document.documentElement.dataset.skin = k;
    document.querySelector('link[rel="apple-touch-icon"]').setAttribute("href", "icon-180-" + k + ".png?v=1");
    document.querySelector('link[rel="manifest"]').setAttribute("href", "manifest-" + k + ".webmanifest");
  }
  // 시작 화면 문구가 첫 화면부터 맞는 언어로 나오게
  var l = new URLSearchParams(location.search).get("lang") || localStorage.getItem("stylist.lang");
  if (l === "en") document.documentElement.lang = "en";
} catch (e) {}
</script>

    <symbol id="i-gem" viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 13L2 9Z"/><path d="M11 3 8 9l4 13 4-13-3-6"/><path d="M2 9h20"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></symbol>
  </defs>
</svg>

<!-- ── 로그인 ─────────────────────────────── -->
<section id="screen-auth" class="screen" hidden>
  <div class="auth-box">
    <div class="auth-label" aria-hidden="true"><span class="wm">Stylist</span><span class="sub">MADE FOR <b>ONE</b></span></div>
    <h1 class="auth-tag">내 옷장으로 오늘 뭐 입지</h1>
    <form id="login-form">
      <label>이메일<input type="email" id="login-email" autocomplete="username" required></label>
      <label>비밀번호<input type="password" id="login-pw" autocomplete="current-password" required></label>
      <button type="submit" class="btn pri" id="login-btn">로그인</button>
      <p id="login-err" class="err" hidden></p>
    </form>
  </div>
</section>

<!-- ── 앱 ────────────────────────────────── -->
<div id="app" hidden>

  <!-- 오늘 -->
  <main id="tab-today" class="tab">
    <div id="td-body"></div>
  </main>

  <!-- 옷장 -->
  <main id="tab-closet" class="tab" hidden>
    <header class="ph-head">
      <div class="row"><div class="h1"><span id="cl-title">옷장</span> <small id="cl-count">0</small></div>
        <div class="head-tools"><button class="icon-btn gear" data-settings aria-label="설정"><svg class="i"><use href="#i-gear"/></svg></button><div class="lang"><button data-l="ko" class="on">KO</button><button data-l="en">EN</button></div><button class="icon-btn" id="cl-search-btn" aria-label="검색"><svg class="i"><use href="#i-search"/></svg></button></div></div>
      <input id="cl-search" type="search" placeholder="이름·색·브랜드" autocomplete="off" hidden>
      <div class="cl-links">
        <button class="cl-struct" id="cl-struct" hidden><span class="strip"></span><b><span data-t="structIn">구조</span><svg class="i s"><use href="#i-chev"/></svg></b></button>
        <button class="cl-struct cl-log" id="cl-log"><span class="th"></span><b><span data-t="wlIn">입은 기록</span><svg class="i s"><use href="#i-chev"/></svg></b></button>
      </div>
      <div class="segc scroll" id="cl-cat"></div>
      <div class="chips sub" id="cl-sub" hidden></div>
      <div class="chips" id="cl-filter"></div>
    </header>
    <button id="cl-queue" class="queue" hidden><span></span><svg class="i s"><use href="#i-chev"/></svg></button>
    <div id="cl-grid" class="grid3"></div>
  </main>

  <!-- 등록 -->
  <main id="tab-add" class="tab" hidden>
    <header class="ph-head"><div class="row"><div class="h1" data-t="addTitle">옷 등록</div><button class="icon-btn" data-settings aria-label="설정"><svg class="i"><use href="#i-gear"/></svg></button></div></header>
    <div class="add-body" id="add-body"></div>
  </main>

  <!-- 판정 -->
  <main id="tab-judge" class="tab" hidden>
    <header class="ph-head"><div class="row"><div class="h1" data-t="buyTitle">내게 맞는 한 벌일까</div><button class="icon-btn" data-settings aria-label="설정"><svg class="i"><use href="#i-gear"/></svg></button></div></header>
    <div class="judge-body" id="buy-body"></div>
  </main>

  <nav id="tabbar">
    <button data-tab="today" class="on"><svg class="i"><use href="#i-sun"/></svg><span data-t="tab_today">오늘</span></button>
    <button data-tab="closet"><svg class="i"><use href="#i-grid"/></svg><span data-t="tab_closet">옷장</span></button>
    <button data-tab="add"><svg class="i"><use href="#i-cam"/></svg><span data-t="tab_add">등록</span></button>
    <button data-tab="judge"><svg class="i"><use href="#i-badge"/></svg><span data-t="tab_buy">구매</span></button>
  </nav>
</div>

<div id="modal-wrap" hidden>
  <div id="modal-back"></div>
  <div id="modal" role="dialog" aria-modal="true"></div>
</div>
<div id="toast" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
