<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Stylist</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></symbol>
    <symbol id="i-rain" viewBox="0 0 24 24"><path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2"/><path d="M16 14v6M8 14v6M12 16v6"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-cam" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></symbol>
    <symbol id="i-badge" viewBox="0 0 24 24"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-ban" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></symbol>
    <symbol id="i-gem" viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 13L2 9Z"/><path d="M11 3 8 9l4 13 4-13-3-6"/><path d="M2 9h20"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></symbol>
  </defs>
</svg>

<!-- ── 로그인 ─────────────────────────────── -->
<section id="screen-auth" class="screen" hidden>
  <div class="auth-box">
    <div class="auth-label" aria-hidden="true"><span class="wm">Stylist</span><span class="sub">MADE FOR <b>ONE</b></span></div>
    <h1 class="auth-tag">내 옷장으로 오늘 뭐 입지</h1>
    <form id="login-form">
      <label>이메일<input type="email" id="login-email" autocomplete="username" required></label>
      <label>비밀번호<input type="password" id="login-pw" autocomplete="current-password" required></label>
      <button type="submit" class="btn pri" id="login-btn">로그인</button>
      <p id="login-err" class="err" hidden></p>
    </form>
  </div>
</section>

<!-- ── 앱 ────────────────────────────────── -->
<div id="app" hidden>

  <!-- 오늘 -->
  <main id="tab-today" class="tab">
    <div id="td-body"></div>
  </main>

  <!-- 옷장 -->
  <main id="tab-closet" class="tab" hidden>
    <header class="ph-head">
      <div class="row"><div class="h1"><span id="cl-title">옷장</span> <small id="cl-count">0</small></div>
        <div class="head-tools"><button class="icon-btn gear" data-settings aria-label="설정"><svg class="i"><use href="#i-gear"/></svg></button><div class="lang"><button data-l="ko" class="on">KO</button><button data-l="en">EN</button></div><button class="icon-btn" id="cl-search-btn" aria-label="검색"><svg class="i"><use href="#i-search"/></svg></button></div></div>
      <input id="cl-search" type="search" placeholder="이름·색·브랜드" autocomplete="off" hidden>
      <div class="cl-links">
        <button class="cl-struct" id="cl-struct" hidden><span class="strip"></span><b><span data-t="structIn">구조</span><svg class="i s"><use href="#i-chev"/></svg></b></button>
        <button class="cl-struct cl-log" id="cl-log"><span class="th"></span><b><span data-t="wlIn">입은 기록</span><svg class="i s"><use href="#i-chev"/></svg></b></button>
      </div>
      <div class="segc scroll" id="cl-cat"></div>
      <div class="chips sub" id="cl-sub" hidden></div>
      <div class="chips" id="cl-filter"></div>
    </header>
    <button id="cl-queue" class="queue" hidden><span></span><svg class="i s"><use href="#i-chev"/></svg></button>
    <div id="cl-grid" class="grid3"></div>
  </main>

  <!-- 등록 -->
  <main id="tab-add" class="tab" hidden>
    <header class="ph-head"><div class="row"><div class="h1" data-t="addTitle">옷 등록</div><button class="icon-btn" data-settings aria-label="설정"><svg class="i"><use href="#i-gear"/></svg></button></div></header>
    <div class="add-body" id="add-body"></div>
  </main>

  <!-- 판정 -->
  <main id="tab-judge" class="tab" hidden>
    <header class="ph-head"><div class="row"><div class="h1" data-t="buyTitle">내게 맞는 한 벌일까</div><button class="icon-btn" data-settings aria-label="설정"><svg class="i"><use href="#i-gear"/></svg></button></div></header>
    <div class="judge-body" id="buy-body"></div>
  </main>

  <nav id="tabbar">
    <button data-tab="today" class="on"><svg class="i"><use href="#i-sun"/></svg><span data-t="tab_today">오늘</span></button>
    <button data-tab="closet"><svg class="i"><use href="#i-grid"/></svg><span data-t="tab_closet">옷장</span></button>
    <button data-tab="add"><svg class="i"><use href="#i-cam"/></svg><span data-t="tab_add">등록</span></button>
    <button data-tab="judge"><svg class="i"><use href="#i-badge"/></svg><span data-t="tab_buy">구매</span></button>
  </nav>
</div>

<div id="modal-wrap" hidden>
  <div id="modal-back"></div>
  <div id="modal" role="dialog" aria-modal="true"></div>
</div>
<div id="toast" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
